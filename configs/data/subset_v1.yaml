# =====================================================================
## subset_v1 -- the dataset construction spec.
# subset_v1 represents the initial bias matching configuration based on our findings from the metadat_EDA.ipynb notebook.

# It's mainly based on the strategy applied in this repo: <https://github.com/gendetection/UnbiasedGenImage>

# Our final configuration on the actual images should be in subset_final.yaml
## =====================================================================

name: subset_v1
seed: 42

## GenImage labels its real (ImageNet) images with this token in the `generator` column. Verify against your metadata.csv before trusting it.
real_generator_token: nature

# ---------------------------------------------------------------------
# Generator split. This encodes what "out of distribution" MEANS in this
# project, so it is the most consequential choice in the file.
#
# Reasoning (fill in / revise after your EDA):
#   * SD 1.4 and 1.5 stay together in TRAIN. Splitting them would create a
#     fake "OOD" test that is really in-distribution and would flatter the
#     model.
#   * BigGAN is held out to test cross-ARCHITECTURE-FAMILY generalisation
#     (GAN vs diffusion). This is the hardest and most informative case.
#   * Midjourney is held out as a closed, differently-tuned system.
#   * Wukong is held out as a diffusion model from a different lab/pipeline.
# ---------------------------------------------------------------------
train_generators:
  - stable_diffusion_v_1_4
  - stable_diffusion_v_1_5
  - glide
  - adm
  - vqdm

ood_generators:
  - midjourney
  - wukong
  - biggan

# ---------------------------------------------------------------------
# Bias matching
# ---------------------------------------------------------------------
matching:
  min_side: 450
  max_side: 550
    # Since majority generators have their modal image dimesnions around 512x512
  jpeg_qf: 96     # 96 since this is the modal jpeg_qg
  jpeg_qf_tolerance: 0
    # All AI generated images in the dataset have a QF value of exactly 100 (uncompressed PNGs), while real images have varied QF values ranging from 60 to 100.
    # We restrict the real images to a high range (96-100) where the range still gives us enough real images to work with.

# ---------------------------------------------------------------------
# Split fractions apply to the IN-DISTRIBUTION pool only, and are applied
# over GROUPS (near-duplicate clusters), never over rows.
# ---------------------------------------------------------------------
splits:
  val_fraction: 0.10
  test_in_dist_fraction: 0.10

# Near-duplicate clustering. Tune max_distance by eye using the pair grid in the image EDA notebook
# For the Piegonhold Principle to work, ensure phash_max_distance < n_bands
# See `integrity.near_duplicate_pairs` function for more info
dedup:
  max_distance: 5
  n_bands: 8

# Final level preprocessing applied to each image 
# images are resized and re-encoded in order to eliminate any signal from dimensions and jpeg_qf
preprocessing:
  image_size: 512 
  jpeg_qf: 98

# ---------------------------------------------------------------------
# Pilot. Scaling up to the full dataset means changing ONE number here.
# n_per_stratum applies per (split, label, generator) cell.
# ---------------------------------------------------------------------
pilot:
  n_per_stratum: 60